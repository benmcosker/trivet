<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Trivet">
  <!--
    The wordmark's mark: a clay dot in a green field.

    A filled tile rather than a bare glyph: a favicon sits on a tab strip whose
    colour the browser chooses, and an unbacked mark vanishes against a dark
    one. The tile carries its own background, so it survives both.

    The dot is 0.375 of the tile, the same ratio as the 9px dot in the 24px
    circle beside the wordmark in the top bar, so the two read as one mark at
    two sizes rather than as two drawings.

    A placeholder device, like the wordmark it comes from - expect it to be
    replaced by a finished logo.
  -->
  <rect width="32" height="32" rx="7" fill="#2f6f4e"/>
  <circle cx="16" cy="16" r="6" fill="#b4552d"/>
</svg>
