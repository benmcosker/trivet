<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved copy of the shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6f4e}a:hover{color:#1f5038}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f4ed; color: #1a1815; font-family: Karla, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g></svg>
        <span style="font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 1">Trivet</span>
      </div>
      <span style="font-weight: 600; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #746c5c">Sign out</span>
    </div>
    <nav style="display: flex; gap: 26px; font-weight: 600; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #746c5c; white-space: nowrap; overflow: hidden">
      <span style="padding-bottom: 8px">Recipes</span>
      <span style="padding-bottom: 6px; color: #1a1815; border-bottom: 2px solid #a44a24">This week</span>
      <span style="padding-bottom: 8px">Pantry</span>
      <span style="padding-bottom: 8px">Upload</span>
    </nav>
  </header>

  <div role="status" style="background: #efe9dc; border-top: 1px solid #ded7c8; border-bottom: 1px solid #ded7c8; padding: 12px 20px; display: flex; gap: 12px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><g fill="none" stroke="#1a1815" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16.2a5 5 0 0 1 6 0"></path><path d="M12 20h.01"></path><path d="M3 3l18 18"></path></g></svg>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #1a1815">No signal · Saved Tuesday, 6:04pm</span>
      <span style="font-family: Newsreader, Georgia, serif; font-style: italic; font-weight: 300; font-size: 15px; line-height: 1.35; color: #4a453c">Your list as it was then. Tap an item to cross it off on this phone.</span>
    </div>
  </div>

  <main style="padding: 22px 20px 0; display: flex; flex-direction: column">
    <span style="font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #a44a24">From five dinners</span>
    <h2 style="margin: 6px 0 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1">Shopping list</h2>
    <div style="height: 1px; background: #1a1815; margin-top: 14px"></div>

    <span style="margin-top: 26px; font-weight: 700; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #746c5c">Produce</span>
    <div style="height: 1px; background: #1a1815; margin-top: 12px"></div>

    <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; column-gap: 12px; padding: 16px 0; border-bottom: 1px solid #ded7c8">
        <sc-if value="{{row.crossed}}" hint-placeholder-val="{{false}}">
          <span style="font-weight: 700; font-size: 13px; padding-top: 5px; color: #746c5c; text-decoration: line-through">{{row.amount}}</span>
          <button type="button" aria-pressed="true" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-family: Newsreader, Georgia, serif; font-size: 20px; line-height: 1.2; color: #746c5c; text-decoration: line-through">{{row.name}}</span>
            <span style="font-size: 11px; letter-spacing: 0.06em; line-height: 1.4; color: #746c5c">Crossed off on this phone</span>
          </button>
        </sc-if>
        <sc-if value="{{row.open}}" hint-placeholder-val="{{true}}">
          <span style="font-weight: 700; font-size: 13px; padding-top: 5px">{{row.amount}}</span>
          <button type="button" aria-pressed="false" style="all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-family: Newsreader, Georgia, serif; font-size: 20px; line-height: 1.2">{{row.name}}</span>
            <span style="font-size: 11px; letter-spacing: 0.06em; line-height: 1.4; color: #746c5c">{{row.from}}</span>
          </button>
        </sc-if>
        <div style="display: flex; gap: 14px; padding-top: 6px; font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #847a69; white-space: nowrap">
          <button type="button" disabled="" style="all: unset; color: #847a69; cursor: default">Got it</button>
          <button type="button" disabled="" style="all: unset; color: #847a69; cursor: default">Always have</button>
        </div>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { amount: '2 tins', name: 'cannellini beans', from: 'White Bean and Kale Soup', crossed: true },
      { amount: '2', name: 'carrots', from: 'Pork Shoulder Ragu', crossed: true },
      { amount: '1 bunch', name: 'lacinato kale', from: 'White Bean and Kale Soup', crossed: false },
      { amount: '2', name: 'lemon', from: 'Sheet Pan Chicken Thighs, Shrimp and Grits', crossed: false },
      { amount: '3', name: 'onions', from: 'White Bean and Kale Soup, Pork Shoulder Ragu', crossed: false }
    ];
    return { rows: rows.map((r) => ({ ...r, open: !r.crossed })) };
  }
}
</script>
</body>
</html>
