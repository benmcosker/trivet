<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share sheet with a photo of a card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6f4e}a:hover{color:#1f5038}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6b665d; font-family: Karla, system-ui, sans-serif; color: #1a1815; overflow: hidden; display: flex; flex-direction: column; padding-top: 54px">
  <div style="flex-grow: 1; background: #f7f4ed; border-radius: 10px 10px 0 0; padding: 40px 32px 0; display: flex; flex-direction: column">
    <svg width="44" height="44" viewBox="0 0 32 32" role="img" aria-label="Trivet"><g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g><circle cx="16" cy="16" r="3.5" fill="#a44a24"></circle></svg>

    <h1 style="margin: 24px 0 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1">Ready for Trivet</h1>
    <div style="height: 1px; background: #1a1815; margin-top: 16px"></div>
    <p style="margin: 16px 0 0; font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 1.45; color: #2c2820">{{message}}</p>

    <div style="margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap">
      <sc-for list="{{photos}}" as="photo" hint-placeholder-count="1">
        <div aria-hidden="true" style="width: 96px; height: 72px; background: #e8e0d0; border: 1px solid #cfc6b2; box-sizing: border-box; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; transform: rotate(-1.5deg)">
          <div style="height: 2px; width: 60%; background: #847a69"></div>
          <div style="height: 2px; width: 85%; background: #847a69"></div>
          <div style="height: 2px; width: 75%; background: #847a69"></div>
          <div style="height: 2px; width: 50%; background: #847a69"></div>
        </div>
      </sc-for>
    </div>

    <button type="button" style="margin-top: 28px; width: 100%; height: 48px; border: 0; border-radius: 0; background: #1a1815; color: #f7f4ed; font-family: Karla, system-ui, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer">Done</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"int","default":1,"min":1,"max":6},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const count = Math.max(1, Math.min(6, this.props.count ?? 1));
    const message = count === 1
      ? 'Your photo is waiting. Open Trivet and it will be read as a card on the Add a recipe page.'
      : 'Your ' + count + ' photos are waiting. Open Trivet and they will be read as one recipe on the Add a recipe page.';
    const photos = Array.from({ length: count }, (_, i) => ({ n: i + 1 }));
    return { message, photos };
  }
}
</script>
</body>
</html>
