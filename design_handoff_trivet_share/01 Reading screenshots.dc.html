<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share sheet reading two screenshots</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6f4e}a:hover{color:#1f5038}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6b665d; font-family: Karla, system-ui, sans-serif; color: #1a1815; overflow: hidden; display: flex; flex-direction: column; padding-top: 54px">
  <div style="flex-grow: 1; background: #f7f4ed; border-radius: 10px 10px 0 0; padding: 40px 32px 0; display: flex; flex-direction: column">
    <svg width="44" height="44" viewBox="0 0 32 32" role="img" aria-label="Trivet"><g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g><circle cx="16" cy="16" r="3.5" fill="#a44a24"></circle></svg>

    <h1 style="margin: 24px 0 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1">Reading {{count}} screenshots</h1>
    <div style="height: 1px; background: #1a1815; margin-top: 16px"></div>
    <p style="margin: 16px 0 0; font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 1.45; color: #2c2820">Finding the words, here on your phone. Nothing has been sent anywhere.</p>

    <div role="progressbar" aria-label="Reading the screenshots" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45" style="margin-top: 28px; height: 4px; background: #e1d8c5">
      <div style="width: 45%; height: 4px; background: #2f6f4e"></div>
    </div>

    <div style="margin-top: 28px; display: flex; gap: 12px">
      <sc-for list="{{shots}}" as="shot" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
          <div aria-hidden="true" style="width: 72px; height: 132px; background: #1a1815; box-sizing: border-box; padding: 54px 8px 0; display: flex; flex-direction: column; gap: 5px">
            <div style="height: 4px; width: 90%; background: #cfc7b6"></div>
            <div style="height: 4px; width: 100%; background: #cfc7b6"></div>
            <div style="height: 4px; width: 70%; background: #cfc7b6"></div>
            <div style="height: 4px; width: 85%; background: #cfc7b6"></div>
            <div style="height: 4px; width: 60%; background: #cfc7b6"></div>
          </div>
          <span style="font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #746c5c">{{shot.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"int","default":2,"min":1,"max":6},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const count = Math.max(1, Math.min(6, this.props.count ?? 2));
    const shots = Array.from({ length: Math.min(count, 4) }, (_, i) => ({ label: String(i + 1) }));
    return { count, shots };
  }
}
</script>
</body>
</html>
