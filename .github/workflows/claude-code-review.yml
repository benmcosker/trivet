name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned, not `@v1`. `v1` is a floating tag, which made it a
        # suspect in #122 when this job went red with nothing changing here.
        # It was not the cause - the token was - but a dependency that can
        # change under every pull request without anybody deciding to is
        # worth nailing down either way. v1.0.262 is what `v1` resolved to
        # on 2026-10-25, so this pins today's behaviour rather than altering
        # it, and an upgrade becomes a commit somebody made on purpose.
        #
        # The marketplace below cannot be pinned the same way. The action
        # passes it verbatim to `claude plugin marketplace add`, which clones
        # the default branch; the input takes a bare URL and no ref. So that
        # one stays floating until the action offers somewhere to put a commit.
        uses: anthropics/claude-code-action@v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts the review on the pull request itself, as an inline
          # comment per finding. Without it Claude writes only to the workflow
          # run log, which nobody reads.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Needed even though the skill's own frontmatter names the same tool:
          # the action starts the MCP server that posts inline comments only
          # when --allowedTools names it here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
