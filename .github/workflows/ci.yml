name: CI

# Once per pull request, and again on main after a merge. Not on every branch
# push as well: every change here goes through a pull request, so that ran the
# whole job twice for each push.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the run before it pointless.
# Runs on main are never cancelled, so every merge is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, so a change to nothing the job tests - Markdown, docs,
  # design handoffs, the iPhone project, which this job never builds - skips
  # it. `check` is a required status check on main, and a job skipped by its
  # `if` reports as passing, so a docs-only pull request is not left blocked
  # waiting for it. Anything it cannot work out runs the full job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)
          else
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename' || true)
          fi
          if [ -z "$files" ]; then
            echo "Could not list the changed files, so running the full check."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tested=$(printf '%s\n' "$files" \
            | grep -Ev '^([^/]+\.md|.*/README\.md|docs/.*|design_handoff_[^/]+/.*|ios/.*|\.claude/.*)$' \
            || true)
          if [ -n "$tested" ]; then
            echo "Files the check covers:"
            printf '%s\n' "$tested"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, design handoffs or the iPhone project changed. Skipping the check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      # The search tests exercise Postgres-specific behaviour (tsvector
      # triggers, trigram indexes), so they need a real database rather than
      # a stand-in.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealmagic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mealmagic
      BETTER_AUTH_SECRET: ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000

      # The account the browser check signs in as. Written by
      # `npm run browse:seed` into this job's throwaway database, which is
      # deleted with the runner - so this is a literal for the same reason
      # BETTER_AUTH_SECRET above is, not an oversight.
      BROWSE_EMAIL: browse@example.com
      BROWSE_PASSWORD: ci-only-browse-password

      # `npm ci` would otherwise fetch every browser Playwright ships, on
      # every run, for a check that wants one of them. Chromium is installed
      # explicitly below instead.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, so the client exists before
      # typecheck, tests and build need it.
      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      # The palette against WCAG AA, by the design system generator
      # (design/README.md). Pinned, so a new release cannot fail an unrelated
      # pull request; the version is in package.json.
      - run: npm run check:design

      - run: npm run db:deploy

      - run: npm test

      - run: npm run build

      # Everything above this line can pass while the app is broken in a
      # browser. A function crossing from a server component into MUI's client
      # code typechecks, builds, serves 200, and dies when React hydrates -
      # only a real browser watching for page errors sees it. The steps below
      # are that browser.
      #
      # After the build, because it serves the production build, and after
      # `npm test`, which empties the database the seed then writes to.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          nohup npm run start > /tmp/app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The app did not answer /api/health within two minutes."
          exit 1

      - name: Seed the browse account
        run: npm run browse:seed

      - name: Browser check
        run: |
          npm run browse -- \
            / /plan /recipes /pantry /household /recipes/new /upload

      # The browser check reports page errors, but when the app itself fell
      # over the reason is in its log rather than in the page. A failure
      # before the app starts - a lint or format check - leaves no log, and
      # a bare cat would then fail too and bury the real error under its own.
      - name: App log
        if: failure()
        run: |
          if [ -f /tmp/app.log ]; then
            cat /tmp/app.log
          else
            echo "No app log: the job failed before the app started."
          fi
