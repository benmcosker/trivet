<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2f6f4e}a:hover{color:#1f5038}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{paper}}; display: flex; align-items: center; justify-content: center">
  <svg width="72" height="72" viewBox="0 0 32 32" role="img" aria-label="Trivet"><g fill="none" stroke="{{green}}" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g><circle cx="16" cy="16" r="3.5" fill="{{clay}}"></circle></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return dark
      ? { paper: '#14110d', green: '#5fae86', clay: '#e08f63' }
      : { paper: '#f7f4ed', green: '#2f6f4e', clay: '#a44a24' };
  }
}
</script>
</body>
</html>
