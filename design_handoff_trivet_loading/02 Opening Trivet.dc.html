<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opening Trivet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6f4e}a:hover{color:#1f5038}
@keyframes simmer{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.55}}
@keyframes trace{0%{stroke-dashoffset:57}60%,100%{stroke-dashoffset:0}}
@keyframes rise{0%{transform:translateY(4px);opacity:0}35%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
@keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.simmer{transform-origin:16px 16px;animation:simmer 1.6s ease-in-out infinite}
.trace{stroke-dasharray:57;animation:trace 1.8s ease-in-out infinite}
.steam{animation:rise 2.1s ease-out infinite}
.steam.b{animation-delay:.7s}.steam.c{animation-delay:1.4s}
.later{animation:arrive .4s ease 1.2s both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f4ed; position: relative; display: flex; align-items: center; justify-content: center">

  <div role="status" aria-label="Opening Trivet" style="display: flex; flex-direction: column; align-items: center">
    <sc-if value="{{isSimmer}}" hint-placeholder-val="{{true}}">
      <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g><circle class="simmer" cx="16" cy="16" r="3.5" fill="#a44a24"></circle></svg>
    </sc-if>
    <sc-if value="{{isTrace}}" hint-placeholder-val="{{false}}">
      <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle class="trace" cx="16" cy="16" r="9" transform="rotate(-90 16 16)"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g><circle cx="16" cy="16" r="3.5" fill="#a44a24"></circle></svg>
    </sc-if>
    <sc-if value="{{isSteam}}" hint-placeholder-val="{{false}}">
      <svg width="72" height="108" viewBox="0 -16 32 48" aria-hidden="true" style="margin-top: -36px">
        <g fill="none" stroke="#a09788" stroke-width="1.6" stroke-linecap="round">
          <path class="steam" d="M12 2c-2-2.5 2-4 0-6.5"></path>
          <path class="steam b" d="M16 1c-2-2.5 2-4 0-6.5"></path>
          <path class="steam c" d="M20 2c-2-2.5 2-4 0-6.5"></path>
        </g>
        <g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g><circle cx="16" cy="16" r="3.5" fill="#a44a24"></circle>
      </svg>
    </sc-if>
  </div>

  <p class="later" style="position: absolute; left: 0; right: 0; top: 476px; margin: 0; text-align: center; font-family: Newsreader, Georgia, serif; font-style: italic; font-weight: 300; font-size: 17px; color: #4a453c">Opening your kitchen</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"enum","default":"simmer","options":["simmer","trace","steam"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const motion = this.props.motion ?? 'simmer';
    return { isSimmer: motion === 'simmer', isTrace: motion === 'trace', isSteam: motion === 'steam' };
  }
}
</script>
</body>
</html>
