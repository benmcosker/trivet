<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipes loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&amp;family=Newsreader:opsz,wght@6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6f4e}a:hover{color:#1f5038}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.wait{animation:breathe 1.8s ease-in-out infinite}
.stripes{background:repeating-linear-gradient(135deg,#e8e0d0 0 11px,#e1d8c5 11px 22px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f4ed; color: #1a1815; font-family: Karla, system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column">

  <header style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#2f6f4e" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="16" r="9"></circle><path d="M16 25v4.2M8.2 11.5 4.5 9.4M23.8 11.5 27.5 9.4"></path></g></svg>
        <span style="font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 1">Trivet</span>
      </div>
      <span style="font-weight: 600; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #746c5c">Sign out</span>
    </div>
    <nav style="display: flex; gap: 26px; font-weight: 600; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #746c5c; white-space: nowrap; overflow: hidden">
      <span style="padding-bottom: 6px; color: #1a1815; border-bottom: 2px solid #a44a24">Recipes</span>
      <span style="padding-bottom: 8px">This week</span>
      <span style="padding-bottom: 8px">Pantry</span>
      <span style="padding-bottom: 8px">Upload</span>
    </nav>
  </header>
  <div style="height: 1px; background: #ded7c8"></div>

  <main role="status" aria-label="Loading recipes" style="padding: 24px 20px 0; display: flex; flex-direction: column">
    <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1.1">Recipes</h1>

    <div class="wait" style="margin-top: 20px; height: 44px; border-bottom: 1px solid #cfc6b2"></div>

    <div class="wait" style="margin-top: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px">
      <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div class="stripes" style="height: 116px"></div>
          <div style="height: 12px; width: {{tile.wide}}; background: #e1d8c5"></div>
          <div style="height: 12px; width: {{tile.narrow}}; background: #e8e0d0"></div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const widths = [['88%', '52%'], ['74%', '40%'], ['92%', '60%'], ['80%', '46%'], ['70%', '55%'], ['86%', '38%']];
    return { tiles: widths.map(([wide, narrow]) => ({ wide, narrow })) };
  }
}
</script>
</body>
</html>
